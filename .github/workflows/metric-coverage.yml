# Weekly check that every Stocks page category still fills for every kind of
# ticker (tools/coverage_report.py: 20 tickers each of plain stocks, large caps,
# ADRs, OTC, ETFs, leveraged ETFs, preferreds, units, share classes and old
# listings, live against Yahoo and FINRA). The table lands in the run's summary.
# Fails when a metric is blank for every large cap sampled, which usually means
# Yahoo renamed or dropped a field.
name: Metric coverage

on:
  schedule:
    - cron: "41 7 * * 1"          # Mondays, 07:41 UTC
  workflow_dispatch:

concurrency:
  group: metric-coverage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/coverage_report.py --fail-on-gaps --summary "$GITHUB_STEP_SUMMARY"
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
